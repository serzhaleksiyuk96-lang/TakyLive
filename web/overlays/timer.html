<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Таймер-челлендж</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; font-family:"Segoe UI",Roboto,"DejaVu Sans",sans-serif; color:#fff; }
  .hide { display:none !important; }
  #root { position:fixed; inset:0; }

  /* плашки «+10 сек · Аня · Роза» */
  .pops { display:flex; flex-direction:column; gap:6px; }
  .pop { display:flex; align-items:center; gap:8px; font-weight:700; border-radius:999px; padding:5px 14px 5px 6px;
         font-size:17px; white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.35); max-width:540px; overflow:hidden;
         animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both; }
  .pop.out { animation:popOut .45s ease-in both; }
  .pop .g { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.18); flex:none;
            display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden; }
  .pop .g img { width:26px; height:26px; object-fit:contain; }
  .pop .who { font-weight:500; opacity:.92; overflow:hidden; text-overflow:ellipsis; }
  .pop.plus { background:rgba(16,185,129,.93); }
  .pop.minus { background:rgba(239,68,68,.93); }
  @keyframes popIn { from { opacity:0; transform:translateX(-30px) scale(.85); } to { opacity:1; transform:none; } }
  @keyframes popOut { to { opacity:0; transform:translateY(-8px) scale(.9); } }
  @keyframes blink { 50% { opacity:.55; } }
  @keyframes bump { 0% { transform:scale(1); } 30% { transform:scale(1.08); } 100% { transform:scale(1); } }
  .bump { animation:bump .5s ease-out; }

  /* A — классика */
  .A .wrap { position:absolute; top:14px; left:14px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .A .box { background:rgba(13,17,23,.9); border:2px solid #22d3ee; border-radius:16px; padding:10px 26px;
            text-align:center; box-shadow:0 0 24px rgba(34,211,238,.35); }
  .A .time { font-family:Consolas,"DejaVu Sans Mono",monospace; font-size:52px; font-weight:700; line-height:1.1;
             text-shadow:0 0 16px rgba(34,211,238,.8); }
  .A .hint { color:#94a3b8; font-size:12px; margin-top:2px; }
  .A .top { background:rgba(13,17,23,.85); border-radius:12px; padding:8px 12px; font-size:14px; line-height:1.6;
            border:1px solid rgba(34,211,238,.3); }
  .A .top b { color:#22d3ee; }
  .A .low .time { color:#f87171; text-shadow:0 0 16px rgba(248,113,113,.9); animation:blink 1s infinite; }
  .A .done .box { border-color:#f87171; box-shadow:0 0 24px rgba(248,113,113,.5); }
  .A .done .time { color:#f87171; font-family:"Segoe UI",Roboto,sans-serif; font-size:34px; padding:8px 0; }

  /* B — капсула */
  .B .wrap { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:460px; }
  .B .cap { display:flex; align-items:center; gap:12px; border-radius:999px; padding:8px 22px 8px 10px;
            background:linear-gradient(135deg,rgba(99,102,241,.95),rgba(34,211,238,.95)); box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .B .ic { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.2); flex:none;
           display:flex; align-items:center; justify-content:center; font-size:24px; }
  .B .time { font-family:Consolas,"DejaVu Sans Mono",monospace; font-size:40px; font-weight:800; letter-spacing:1px; white-space:nowrap; }
  .B .bar { flex:1; height:10px; border-radius:5px; background:rgba(255,255,255,.25); overflow:hidden; min-width:60px; }
  .B .bar i { display:block; height:100%; width:100%; background:#fff; border-radius:5px; transition:width .8s; }
  .B .ticker { margin-top:8px; background:rgba(10,12,19,.82); border-radius:999px; padding:6px 16px; font-size:14px;
               text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .B .ticker b { color:#fbbf24; }
  .B .pops { margin-top:8px; align-items:flex-end; }
  .B .low .cap { background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(249,115,22,.95)); }
  .B .low .time { animation:blink 1s infinite; }
  .B .done .cap { background:linear-gradient(135deg,rgba(239,68,68,.95),rgba(190,24,93,.95)); }
  .B .done .time { font-family:"Segoe UI",Roboto,sans-serif; font-size:30px; }

  /* C — крупно */
  .C .wrap { position:absolute; top:12px; left:16px; display:flex; flex-direction:column; align-items:flex-start; }
  .C .time { font-size:76px; font-weight:900; line-height:1; color:#fde68a; white-space:nowrap;
             -webkit-text-stroke:2px rgba(0,0,0,.55); text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(251,191,36,.55); }
  .C .hint { font-size:15px; font-weight:700; text-shadow:0 2px 4px rgba(0,0,0,.75); margin:2px 0 8px 4px; }
  .C .pop { border-radius:10px; }
  .C .top { margin-top:12px; min-width:230px; background:rgba(0,0,0,.55); border-radius:14px; padding:10px 12px; }
  .C .top .tt { font-size:13px; color:#fde68a; font-weight:700; letter-spacing:.5px; margin-bottom:6px; }
  .C .row { display:flex; align-items:center; gap:8px; font-size:15px; margin:4px 0; }
  .C .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .C .row .v { color:#34d399; font-weight:700; }
  .C .low .time { color:#fca5a5; text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(248,113,113,.8); animation:blink 1s infinite; }
  .C .done .time { color:#fca5a5; font-size:56px; }

  .paused .time { opacity:.55; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search);
const DEMO = Q.get("demo");
let THEME = (Q.get("theme") || "").toLowerCase();
let lastId = null, cur = null;
const HINTS = {a: "🎁 подарки добавляют время", b: "", c: "🎁 дари — продлевай стрим!"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function clock(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h > 0 ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}

function build(theme) {
  const t = theme.toUpperCase();
  document.getElementById("root").className = t;
  const html = {
    A: `<div class="wrap" id="st"><div class="box"><div class="time" id="time">--:--</div><div class="hint" id="hint"></div></div>
          <div class="pops" id="pops"></div><div class="top hide" id="top"></div></div>`,
    B: `<div class="wrap" id="st"><div class="cap"><div class="ic">⏱</div><div class="time" id="time">--:--</div>
          <div class="bar"><i id="bar"></i></div></div><div class="ticker hide" id="top"></div>
          <div class="pops" id="pops"></div></div>`,
    C: `<div class="wrap" id="st"><div class="time" id="time">--:--</div><div class="hint" id="hint"></div>
          <div class="pops" id="pops"></div><div class="top hide" id="top"></div></div>`,
  }[t];
  document.getElementById("root").innerHTML = html;
  cur = theme;
}

function renderTop(d) {
  const el = document.getElementById("top");
  const top = d.top || [];
  el.classList.toggle("hide", !top.length);
  if (!top.length) return;
  if (cur === "a") el.innerHTML = "🏆 Больше всех продлили<br>" +
    top.map((x, i) => `<b>${i + 1}.</b> ${esc(x.user)} — ${esc(x.text)}`).join("<br>");
  else if (cur === "b") el.innerHTML = "🏆 " + top.map(x => `<b>${esc(x.user)}</b> ${esc(x.text)}`).join(" · ");
  else el.innerHTML = `<div class="tt">🏆 ПРОДЛИЛИ СТРИМ</div>` + top.map((x, i) =>
    `<div class="row">${["🥇","🥈","🥉"][i] || (i + 1) + "."}<span class="n">${esc(x.user)}</span><span class="v">${esc(x.text)}</span></div>`).join("");
}

function pop(e) {
  const box = document.getElementById("pops");
  if (!box) return;
  const icon = String(e.icon || "");
  const g = icon.startsWith("http") || icon.startsWith("/") ? `<img src="${esc(icon)}" onerror="this.replaceWith('🎁')">` : esc(icon || "⏱");
  const who = [e.user, cur === "a" ? e.what : ""].filter(Boolean).map(esc).join(" · ");
  const el = document.createElement("div");
  el.className = "pop " + (e.sec < 0 ? "minus" : "plus");
  el.innerHTML = `<span class="g">${g}</span>${esc(e.text)}${who ? ` <span class="who">· ${who}</span>` : ""}`;
  box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, 4000);
  const tm = document.getElementById("time");
  if (tm) { tm.classList.remove("bump"); void tm.offsetWidth; tm.classList.add("bump"); }
}

function render(d) {
  const theme = THEME || d.theme || "a";
  if (theme !== cur) build(["a","b","c"].includes(theme) ? theme : "a");
  const st = document.getElementById("st");
  const done = d.fired && !d.running;
  st.classList.toggle("low", d.running && d.remaining <= 60);
  st.classList.toggle("done", !!done);
  st.classList.toggle("paused", !d.running && !done);
  document.getElementById("time").textContent = done ? "⏰ ВРЕМЯ ВЫШЛО" : clock(d.remaining);
  const hint = document.getElementById("hint");
  if (hint) { const h = d.hint || HINTS[cur]; hint.textContent = h; hint.classList.toggle("hide", !h); }
  const bar = document.getElementById("bar");
  if (bar) bar.style.width = (d.peak > 0 ? Math.min(100, d.remaining / d.peak * 100) : 0) + "%";
  renderTop(d);
  if (d.popups !== false) for (const e of d.events || []) if (lastId !== null && e.id > lastId) pop(e);
  lastId = Math.max(lastId ?? 0, d.seq ?? 0);
}

async function poll() {
  try {
    const r = await fetch("/api/timer?since=" + (lastId ?? 0), {cache: "no-store"});
    render(await r.json());
  } catch (e) {}
}

if (DEMO) {
  const SAMPLE = [{sec: 600, text: "+10 мин", user: "Аня", what: "Лев", icon: "🦁"},
                  {sec: -60, text: "−1 мин", user: "Тролль", what: "Череп", icon: "💀"},
                  {sec: 10, text: "+10 сек", user: "Костя", what: "Роза", icon: "🌹"}];
  const top = [{user: "Аня", text: "+32 мин"}, {user: "Милана", text: "+14 мин"}, {user: "Костя", text: "+6 мин"}];
  let n = 0, left = 5077;
  const tick = async () => {
    if (!THEME) { try { THEME = (await (await fetch("/api/timer")).json()).theme || "a"; } catch (e) { THEME = "a"; } }
    render({running: true, remaining: left--, peak: 8000, top, popups: true, events: [], seq: 0, hint: ""});
  };
  tick(); setInterval(tick, 1000);
  setTimeout(function demoPop() { pop({id: 0, ...SAMPLE[n++ % SAMPLE.length]}); setTimeout(demoPop, 1600); }, 300);
} else {
  poll(); setInterval(poll, 1000);
}
</script>
</body>
</html>
