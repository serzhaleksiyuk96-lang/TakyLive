<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Топ донатеров</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; font-family:"Segoe UI",Roboto,sans-serif; }
  #panel {
    position:fixed; top:20px; right:20px; width:280px;
    background:rgba(13,17,23,0.9); backdrop-filter:blur(10px);
    border:2px solid #00d4ff; border-radius:16px; padding:16px 18px;
    box-shadow:0 0 24px rgba(0,212,255,0.4);
  }
  .title {
    font-size:16px; font-weight:700; color:#00d4ff; text-align:center;
    margin-bottom:14px; letter-spacing:1px; text-shadow:0 0 10px #00d4ff;
  }
  .row {
    display:flex; align-items:center; gap:10px; padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .row.changed { animation:softin .4s ease; }
  @keyframes softin { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .rank {
    width:26px; height:26px; flex:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; background:#1c2230; color:#8b949e;
  }
  .rank.g1 { background:linear-gradient(135deg,#ffd700,#ff9500); color:#3d2800; }
  .rank.g2 { background:linear-gradient(135deg,#c0c0c0,#8a8a8a); color:#2a2a2a; }
  .rank.g3 { background:linear-gradient(135deg,#cd7f32,#a0522d); color:#2a1500; }
  .name { flex:1; color:#e6edf3; font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .amount { color:#00d4ff; font-size:14px; font-weight:600; }
  .empty { color:#6e7681; text-align:center; font-size:13px; padding:10px 0; }
</style>
</head>
<body>
<div id="panel">
  <div class="title">🏆 ТОП ДОНАТЕРОВ</div>
  <div id="list"><div class="empty">Пока никто не подарил</div></div>
</div>
<script>
async function poll() {
  try {
    const r = await fetch("/api/overlay");
    const d = await r.json();
    render(d.top || []);
  } catch(e) {}
}
let prev = null;
function render(top) {
  const snap = JSON.stringify(top);
  if (snap === prev) return;              // данные не изменились — не трогаем DOM
  const prevArr = prev ? JSON.parse(prev) : [];
  prev = snap;
  const list = document.getElementById("list");
  if (!top.length) { list.innerHTML = '<div class="empty">Пока никто не подарил</div>'; return; }
  list.innerHTML = top.map((t,i) => {
    const was = prevArr[i];
    const changed = !was || was.user !== t.user || was.amount !== t.amount;
    return `
    <div class="row${changed?' changed':''}">
      <div class="rank ${i<3?'g'+(i+1):''}">${i+1}</div>
      <div class="name">${escapeHtml(t.user)}</div>
      <div class="amount">${t.amount} 💎</div>
    </div>`;
  }).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const DEMO = new URLSearchParams(location.search).get("demo");
if (DEMO) {
  render([{user:"Takymi",amount:2450},{user:"Аня",amount:1200},{user:"Витя",amount:860}]);
} else {
setInterval(poll, 2000);
poll();
}
</script>
</body>
</html>
