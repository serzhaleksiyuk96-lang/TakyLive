<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ИИ-голос</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: "Inter", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #card { position: fixed; left: 20px; top: 20px; width: 460px; display: flex; gap: 14px; align-items: center;
          padding: 14px 18px; border-radius: 18px; background: rgba(14,17,28,.86); backdrop-filter: blur(14px);
          border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 40px rgba(0,0,0,.5);
          opacity: 0; transform: translateX(-30px) scale(.96); transition: all .45s cubic-bezier(.2,1.3,.4,1); }
  #card.show { opacity: 1; transform: none; }
  #card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
                  background: linear-gradient(135deg, #f43f5e, #a855f7, #22d3ee);
                  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                  -webkit-mask-composite: xor; mask-composite: exclude; }
  .mic { width: 58px; height: 58px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 30px;
         background: radial-gradient(circle at 35% 30%, #4c1d95, #120a24);
         box-shadow: 0 0 0 3px #120a24, 0 0 0 5px #a855f7; animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { box-shadow: 0 0 0 3px #120a24, 0 0 0 5px #f43f5e, 0 0 30px rgba(244,63,94,.7); } }
  .body { flex: 1; min-width: 0; }
  .lbl { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #c4b5fd; }
  .name { font-size: 26px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .from { font-size: 15px; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 3px; transition: width 1s linear;
           background: linear-gradient(90deg, #f43f5e, #a855f7, #22d3ee); }
  .left { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
</style>
</head>
<body>
<div id="card"><div class="mic">🎙</div>
  <div class="body"><div class="lbl">Голос стримера</div><div class="name" id="name"></div>
    <div class="from" id="from"></div><div class="bar"><i id="bar"></i></div></div>
  <div class="left" id="left"></div></div>
<script>
const $ = id => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).has("demo");
let key = "";

function render(v) {
  const card = $("card");
  if (!v || v.left <= 0) { card.classList.remove("show"); key = ""; return; }
  const k = v.name + "|" + v.user + "|" + v.secs;
  if (k !== key) {                                  // новый голос — сбрасываем полосу без анимации
    key = k;
    $("bar").style.transition = "none"; $("bar").style.width = "100%"; void $("bar").offsetWidth;
    $("bar").style.transition = "";
  }
  $("name").textContent = "«" + v.name + "»";
  $("from").textContent = v.user ? "от " + v.user : "";
  $("left").textContent = v.left;
  $("bar").style.width = Math.max(0, Math.min(100, v.left / Math.max(1, v.secs) * 100)) + "%";
  card.classList.add("show");
}

async function poll() {
  try {
    const d = await (await fetch("/api/overlay?since=999999999", {cache: "no-store"})).json();
    render(d.voice);
  } catch (e) {}
}

if (DEMO) {
  let left = 25;
  render({name: "Демон", user: "Аня", left, secs: 30});
  setInterval(() => { left = left > 1 ? left - 1 : 30; render({name: "Демон", user: "Аня", left, secs: 30}); }, 1000);
} else { poll(); setInterval(poll, 500); }
</script>
</body>
</html>
