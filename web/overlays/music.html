<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Заказ музыки</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; overflow: hidden; font-family: "Inter", "Segoe UI", Roboto, sans-serif; color: #fff; }
  #card { position: fixed; left: 20px; top: 20px; width: 760px; display: flex; gap: 16px; align-items: stretch;
          padding: 14px; border-radius: 20px; background: rgba(14,17,28,.86); backdrop-filter: blur(14px);
          border: 1px solid rgba(255,255,255,.14); box-shadow: 0 14px 40px rgba(0,0,0,.5);
          opacity: 0; transform: translateY(-20px) scale(.97); transition: all .45s cubic-bezier(.2,1.3,.4,1); }
  #card.show { opacity: 1; transform: none; }
  #card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
                  background: linear-gradient(135deg, #34d399, #22d3ee, #a855f7);
                  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                  -webkit-mask-composite: xor; mask-composite: exclude; }
  /* плеер YouTube виден целиком: правила YouTube — встроенный плеер не меньше 200×200 и не прячется */
  #media { width: 356px; height: 200px; flex: none; border-radius: 12px; overflow: hidden; background: #000;
           display: grid; place-items: center; position: relative; }
  #media.nov { width: 200px; background: radial-gradient(circle at 35% 30%, #065f46, #0b1020); }
  #media .disc { font-size: 84px; animation: spin 4s linear infinite; }
  #media img.cover { width: 100%; height: 100%; object-fit: cover; transition: filter .4s; }
  #media img.cover.stop { filter: grayscale(.6) brightness(.6); }
  /* обложка размыто — фоном карточки */
  #bg { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; z-index: -1; }
  #bg img { width: 120%; height: 160%; margin: -10% -10%; object-fit: cover; filter: blur(28px) saturate(1.4); opacity: .32;
            transition: opacity .6s; }
  #card { isolation: isolate; }
  #media .disc.stop { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #yt, #yt iframe { width: 100%; height: 100%; border: 0; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .lbl { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: #6ee7b7; }
  .title { font-size: 26px; font-weight: 800; line-height: 1.15; margin-top: 4px;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { font-size: 17px; color: #cbd5e1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .from { font-size: 15px; color: #fde68a; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width 1s linear;
           background: linear-gradient(90deg, #34d399, #22d3ee, #a855f7); }
  .time { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-top: 4px;
          font-variant-numeric: tabular-nums; }
  .next { font-size: 13.5px; color: #94a3b8; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next b { color: #e2e8f0; font-weight: 700; }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 60px;
        background: repeating-linear-gradient(45deg, #111827 0 12px, #0b1020 12px 24px); }
</style>
</head>
<body>
<div id="card">
  <div id="bg"></div>
  <div id="media"><div id="yt"></div></div>
  <div class="body">
    <div class="lbl" id="lbl">🎵 Сейчас играет</div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="from" id="from"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="time"><span id="pos"></span><span id="dur"></span></div>
    <div class="next" id="next"></div>
  </div>
</div>
<audio id="au" preload="auto"></audio>
<script>
const $ = id => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).has("demo");
let seq = -1, kind = "", ytPlayer = null, ytReady = false, pending = null, st = null;
const au = $("au");

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function report(k, detail) {
  if (DEMO || seq < 0) return;
  fetch("/api/music/event", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({seq, kind: k, detail: detail || ""})}).catch(() => {});
}

// ── YouTube: официальный встроенный плеер (IFrame Player API) ──
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (pending) { const p = pending; pending = null; playYT(p); } };
function loadYTApi() {
  if (document.getElementById("ytapi")) return;
  const s = document.createElement("script");
  s.id = "ytapi"; s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => report("error", "нет связи с YouTube");
  document.head.appendChild(s);
}
const YT_ERR = {2: "неверный ID", 5: "ошибка плеера", 100: "ролик удалён или скрыт",
                101: "владелец запретил встраивание", 150: "владелец запретил встраивание", 153: "YouTube не принял плеер (Referer)"};
function playYT(c) {
  if (!ytReady) { pending = c; loadYTApi(); return; }
  if (ytPlayer) { ytPlayer.loadVideoById(c.tid); ytPlayer.setVolume(st ? st.volume : 60); return; }
  ytPlayer = new YT.Player("yt", {
    width: "100%", height: "100%", videoId: c.tid,
    playerVars: {autoplay: 1, controls: 0, rel: 0, playsinline: 1, origin: location.origin},
    events: {
      onReady: e => { e.target.setVolume(st ? st.volume : 60); e.target.playVideo(); },
      onStateChange: e => {
        if (e.data === 1) report("playing");
        else if (e.data === 0) report("ended");
      },
      onError: e => report("error", YT_ERR[e.data] || ("код " + e.data)),
    }});
}
function stopYT() { try { if (ytPlayer) ytPlayer.stopVideo(); } catch (e) {} }

// ── Яндекс Музыка: звук по ссылке, которую даёт программа ──
au.addEventListener("playing", () => report("playing"));
au.addEventListener("ended", () => report("ended"));
au.addEventListener("error", () => { if (au.getAttribute("src")) report("error", "трек не загрузился"); });

function setBg(url) {
  const bg = $("bg");
  if (!url) { bg.innerHTML = ""; return; }
  if (bg.dataset.url === url) return;
  bg.dataset.url = url;
  bg.innerHTML = '<img alt="" src="' + esc(url) + '">';
}

function start(c) {
  seq = c.seq; kind = c.kind;
  setBg(c.cover);
  stopYT(); au.pause(); au.removeAttribute("src");
  const m = $("media");
  m.classList.toggle("nov", kind !== "youtube");
  if (kind === "youtube") {
    if (!$("yt")) m.innerHTML = '<div id="yt"></div>';
    playYT(c);
  } else {
    if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; }
    m.innerHTML = '<div class="disc">💿</div>';
    if (c.cover) {                                   // обложка трека; не загрузилась — остаётся диск
      const img = new Image();
      img.className = "cover"; img.alt = "";
      img.onload = () => { if (seq === c.seq) { m.innerHTML = ""; m.appendChild(img); } };
      img.src = c.cover;
    }
    if (kind === "audio") {
      au.src = "/api/music/stream?seq=" + c.seq;
      au.volume = (st ? st.volume : 60) / 100;
      au.play().catch(() => {});
    }
  }
}

function stopAll() {
  seq = -1; kind = "";
  stopYT(); au.pause(); au.removeAttribute("src");
  $("card").classList.remove("show");
}

function curPos(c) {
  if (kind === "youtube" && ytPlayer && ytPlayer.getCurrentTime) {
    try { return [ytPlayer.getCurrentTime(), ytPlayer.getDuration() || c.dur]; } catch (e) {}
  }
  if (kind === "audio" && au.src) return [au.currentTime, isFinite(au.duration) && au.duration ? au.duration : c.dur];
  return [c.pos, c.dur];
}

function render(d) {
  st = d;
  const c = d.current;
  if (!d.on || !c) { if (seq !== -1) stopAll(); return; }
  if (c.seq !== seq) start(c);
  // пауза и громкость из окна программы
  try {
    if (kind === "youtube" && ytPlayer && ytPlayer.getPlayerState) {
      ytPlayer.setVolume(d.volume);
      const ps = ytPlayer.getPlayerState();
      if (d.paused && ps === 1) ytPlayer.pauseVideo();
      else if (!d.paused && ps === 2) ytPlayer.playVideo();
    }
    if (kind === "audio") {
      au.volume = d.volume / 100;
      if (d.paused && !au.paused) au.pause();
      else if (!d.paused && au.paused && au.src && !au.ended) au.play().catch(() => {});
    }
  } catch (e) {}
  const disc = document.querySelector("#media .disc, #media img.cover");
  if (disc) disc.classList.toggle("stop", !!d.paused);
  if (c.cover && c.cover !== $("bg").dataset.url) {       // Spotify: обложка могла прийти позже
    setBg(c.cover);
    if (kind !== "youtube" && !document.querySelector("#media img.cover")) start(Object.assign({}, c));
  }
  $("lbl").textContent = (d.paused ? "⏸ Пауза" : "🎵 Сейчас играет") + " · " + d.source_name;
  $("title").textContent = c.title;
  $("artist").textContent = c.artist;
  $("from").textContent = c.user ? "заказ: " + c.user : "";
  const [p, du] = curPos(c);
  $("pos").textContent = fmt(p); $("dur").textContent = du ? fmt(du) : "";
  $("bar").style.width = du ? Math.min(100, p / du * 100) + "%" : "0";
  const q = d.queue || [];
  $("next").innerHTML = q.length ? "Дальше: <b>" + esc(q[0].title) + "</b>" + (q[0].user ? " · " + esc(q[0].user) : "") +
    (q.length > 1 ? " · ещё " + (q.length - 1) : "") : "Заказать: <b>" + esc(d.cmd) + " название</b>";
  $("card").classList.add("show");
}

async function poll() {
  try { render(await (await fetch("/api/music?ov=1", {cache: "no-store"})).json()); } catch (e) {}
  setTimeout(poll, 1000);
}

if (DEMO) {
  $("media").innerHTML = '<div class="ph">🎬</div>';
  seq = 0; kind = "demo";
  render({on: true, paused: false, volume: 60, source_name: "YouTube Music", cmd: "!трек",
          current: {seq: 0, kind: "demo", title: "Название заказанного трека", artist: "Исполнитель",
                    user: "Аня", dur: 200, pos: 74},
          queue: [{title: "Следующий трек", user: "Макс"}, {title: "Ещё один", user: "Оля"}]});
} else {
  poll();
}
</script>
</body>
</html>
